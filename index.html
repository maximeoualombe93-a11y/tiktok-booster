<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAXIME Phœnix</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--panel:#0e1533;--line:#26305c;--gold:#d9b26a;--vio:#8b7cf6;--blue:#4f8cff;--txt:#eef1ff;--mut:#9aa4d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2570 0,transparent 60%),var(--bg);color:var(--txt);font:15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header img{height:52px;border-radius:12px}
header h1{font:600 26px/1 "Cormorant Garamond",Georgia,serif;margin:0;color:var(--gold)}
header small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 77px)}
nav{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--mut);white-space:nowrap}
nav button:hover{color:var(--txt);background:#141c42}
nav button[aria-selected=true]{color:#fff;background:linear-gradient(90deg,#2b3a9a,#5b3fb8);box-shadow:inset 3px 0 var(--gold)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding:22px;max-width:900px}
h2{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 18px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.tool b{display:block;color:var(--gold);margin-bottom:2px}
.tool span{color:var(--mut);font-size:13px}
.btn{all:unset;cursor:pointer;background:linear-gradient(90deg,var(--blue),var(--vio));color:#fff;padding:9px 16px;border-radius:999px;font-weight:700}
.btn.alt{background:none;border:1px solid var(--gold);color:var(--gold)}
.note{margin-top:18px;padding:12px 14px;border-left:3px solid var(--vio);background:#0b1130;color:var(--mut);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select,textarea{background:#0a1028;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;width:100%}
canvas{max-width:100%;border-radius:12px;border:1px solid var(--line);background:#050816}
.stat{font:600 40px/1 "Cormorant Garamond",serif;color:var(--gold)}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:opacity .8s}
#splash img{max-height:88vh;max-width:92vw;border-radius:16px;animation:rise 1.4s ease-out both}
#splash.off{opacity:0;pointer-events:none}
@keyframes rise{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}#splash{transition:none}}
header{background:linear-gradient(180deg,#121a4a,#0a1030);box-shadow:0 10px 30px -10px #000,0 1px 0 var(--gold);position:relative;z-index:2}
header img{box-shadow:0 0 20px #8b7cf688}
header h1{font-size:30px;background:linear-gradient(90deg,#f3d89b,var(--gold) 50%,#b08a44);-webkit-background-clip:text;background-clip:text;color:transparent}
.app{display:block;min-height:0}nav{display:none}main{max-width:1040px;margin:0 auto}
.grp{font:600 24px/1 "Cormorant Garamond",Georgia,serif;color:var(--gold);margin:26px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.cell{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:7px;padding:16px 14px;min-height:150px;border-radius:20px;background:linear-gradient(160deg,#1c2870 0%,#0f1740 55%,#0a0f28 100%);border:1px solid #3a4590;box-shadow:0 14px 28px -10px #000,0 1px 0 #ffffff22 inset,0 0 0 1px #0007;transition:transform .2s,box-shadow .2s}
.cell:hover{transform:translateY(-5px);box-shadow:0 20px 36px -10px #000,0 0 24px #8b7cf666,0 1px 0 #ffffff33 inset}
.cell:active{transform:translateY(1px)}
.cell:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cell i{font-style:normal;font-size:26px;width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#f0cf8a,#9a7634);box-shadow:0 8px 16px -4px #000,inset 0 1px #fff7}
.cell b{font:600 19px/1.1 "Cormorant Garamond",Georgia,serif;color:#fff}
.cell small{color:var(--mut);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.panel{margin-top:14px;padding:22px;border-radius:24px;background:linear-gradient(165deg,#141d58,#0b1130 60%);border:1px solid #3a4590;box-shadow:0 24px 50px -16px #000,0 1px 0 #ffffff22 inset}
.tool{background:linear-gradient(160deg,#18215f,#0d1438);border-color:#34408a;box-shadow:0 12px 24px -10px #000,0 1px 0 #ffffff1a inset}
@media(prefers-reduced-motion:reduce){.cell{transition:none}.cell:hover{transform:none}}
.cell{position:relative;overflow:hidden;border:1px solid #5a66c4;border-bottom:6px solid #04061c;box-shadow:0 20px 30px -10px #000,0 2px 0 #aab4ff55 inset,0 -18px 24px -12px #000a inset;transition:transform .15s,box-shadow .15s,border-bottom-width .15s}
.cell::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,#ffffff26,transparent);pointer-events:none}
.cell:hover{transform:translateY(-6px);box-shadow:0 28px 38px -10px #000,0 0 26px #8b7cf677,0 2px 0 #aab4ff77 inset,0 -18px 24px -12px #000a inset}
.cell:active{transform:translateY(4px);border-bottom-width:2px;box-shadow:0 6px 10px -4px #000,0 8px 16px -8px #000 inset}
.cell i{box-shadow:0 10px 16px -4px #000,0 2px 0 #fff9 inset,0 -6px 8px -2px #5a3f0acc inset}
.cell b{text-shadow:0 2px 3px #000}
.panel,.tool{border-bottom-width:5px;border-bottom-color:#04061c;box-shadow:0 24px 40px -14px #000,0 2px 0 #aab4ff44 inset,0 -16px 24px -14px #000a inset}
.btn{box-shadow:0 5px 0 #2a2f80,0 12px 16px -4px #000,0 1px 0 #ffffff66 inset;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2a2f80,0 3px 6px #000}
.btn.alt{box-shadow:0 5px 0 #6b5421,0 12px 16px -4px #000}
.btn.alt:active{box-shadow:0 1px 0 #6b5421,0 3px 6px #000}
input,select,textarea{box-shadow:0 3px 8px #000c inset,0 1px 0 #ffffff1a}
@media(prefers-reduced-motion:reduce){.cell,.btn{transition:none}}
.tiles{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.cell{--h:260;min-height:200px;padding:20px 16px;gap:10px;border-radius:26px;background:linear-gradient(160deg,hsl(var(--h) 90% 58%) 0%,hsl(var(--h) 85% 36%) 55%,hsl(var(--h) 80% 20%) 100%);border:2px solid hsl(var(--h) 95% 72%);border-bottom:10px solid hsl(var(--h) 85% 9%);box-shadow:0 28px 36px -12px #000,0 3px 0 #ffffff77 inset,0 -24px 30px -14px #0009 inset}
.cell:hover{transform:translateY(-8px);box-shadow:0 36px 44px -12px #000,0 0 34px hsl(var(--h) 100% 60% / .7),0 3px 0 #ffffff88 inset,0 -24px 30px -14px #0009 inset}
.cell:active{transform:translateY(6px);border-bottom-width:3px}
.cell i{width:68px;height:68px;font-size:36px;border-radius:20px;background:linear-gradient(145deg,hsl(var(--h) 100% 82%),hsl(var(--h) 90% 48%));box-shadow:0 12px 18px -4px #000,0 3px 0 #fffb inset,0 -8px 10px -2px hsl(var(--h) 90% 20%) inset}
.cell b{font-size:25px;color:#fff}
.cell small{font-size:13px;color:#fffd;-webkit-line-clamp:3}
</style></head><body>

];
const MODELS=[['Accroche','Personne ne vous dit ça sur [sujet]… regardez jusqu’à la fin.'],['Accroche','3 erreurs que je ne referai plus avec [sujet].'],['Légende','✨ Innover. Performer. Rayonner. [message] #MaximePhoenix'],['Annonce','Nouveau chez 2 PRO LUX : [produit]. Disponible dès maintenant.'],['Avec effet (lettres dorées)','★ 𝓜𝓪𝔁𝓲𝓶𝓮 𝓟𝓱𝓸𝓮𝓷𝓲𝔁 · [titre] ★'],['Avec effet (souligné)','▬▬ [TITRE EN MAJUSCULES] ▬▬'],['Sans effet','Voici ce que j’ai appris cette semaine : [résumé].'],['Appel à l’action','Abonnez-vous pour la suite et partagez à quelqu’un qui en a besoin.']];
const NET=['TikTok','Facebook','YouTube','Instagram','Douyin','Xiaohongshu'];
const $=s=>document.querySelector(s),nav=$('#nav'),main=$('#main');
let cur='retouche';
T.forEach(t=>{const b=document.createElement('button');b.textContent=t.n;b.setAttribute('role','tab');b.onclick=()=>show(t.id);b.dataset.id=t.id;nav.appendChild(b)});
function show(id){cur=id;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));const t=T.find(x=>x.id===id);
main.innerHTML=`<button class="btn alt" onclick="home()">Retour</button><div class="panel"><h2>${t.n}</h2><p class="lead">${t.d}</p><div id="body"></div></div>`;
const B=$('#body');
if(t.t){B.innerHTML='<div class="grid">'+t.t.map(x=>`<div class="tool"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div>'+(t.api?'<p class="note">Cet onglet est prêt côté interface. La génération réelle sera connectée à un service externe à l’étape GitHub.</p>':'')}
if(t.k==='photo')photo(B);if(t.k==='voice')voice(B);if(t.k==='write')write(B);if(t.k==='models')models(B);if(t.k==='dl')dl(B);if(t.k==='dash')dash(B);if(t.k==='tags')tags(B);
window.scrollTo(0,0);}
const G=[['Créer',['retouche','image','video','reels','carrousel','collage','fond','qualite','miniatures']],['Effets et audio',['effets','sons','voix','soustitres','doublage']],['Texte',['ecriture','modeles','tags','idees']],['Réseaux sociaux',['publier','planif','heures','telecharger','decoupe','comm','global','inspiration']],['Marque et suivi',['kit','filigrane','media','stats','monet','histo','reglages']]];
const IC={retouche:'🖼️',image:'🎨',video:'🎬',reels:'📱',carrousel:'🗂️',collage:'🧩',fond:'✂️',qualite:'💎',miniatures:'🏞️',effets:'✨',sons:'🎧',voix:'🎙️',soustitres:'💬',doublage:'🌍',ecriture:'✍️',modeles:'📝',tags:'#️⃣',idees:'💡',publier:'🚀',planif:'📅',heures:'⏰',telecharger:'⬇️',decoupe:'🔪',comm:'💭',global:'📊',inspiration:'🏮',kit:'👑',filigrane:'🔰',media:'📁',stats:'📈',monet:'💰',histo:'🕘',reglages:'⚙️'};
function home(){main.innerHTML='<h2>Studio MAXIME Phœnix</h2><p class="lead">Touchez une case pour ouvrir l’outil.</p>'+G.map(g=>`<h3 class="grp">${g[0]}</h3><div class="tiles">`+g[1].map(id=>{const t=T.find(x=>x.id===id);return `<button class="cell" style="--h:${Math.round(T.indexOf(t)*137.5)%360}" onclick="show('${id}')"><i>${IC[id]}</i><b>${t.n}</b><small>${t.d}</small></button>`}).join('')+'</div>').join('');window.scrollTo(0,0)}
function photo(B){B.innerHTML=`<div class="row"><input type="file" id="f" accept="image/*"></div><canvas id="c" width="600" height="400"></canvas>
<div class="grid" style="margin-top:12px">${[['br','Luminosité',100,50,200],['co','Contraste',100,50,200],['sa','Saturation',100,0,250],['bl','Flou',0,0,10],['sp','Sépia',0,0,100]].map(a=>`<label>${a[1]}<input type="range" id="${a[0]}" value="${a[2]}" min="${a[3]}" max="${a[4]}"></label>`).join('')}</div>
<div class="row"><button class="btn" id="dlp">Télécharger l’image</button><button class="btn alt" id="rst">Réinitialiser</button></div>`;
const c=$('#c'),x=c.getContext('2d');let img=null;
const draw=()=>{x.clearRect(0,0,c.width,c.height);if(!img){x.fillStyle='#9aa4d0';x.font='16px Manrope,sans-serif';x.fillText('Choisissez une photo pour commencer',150,200);return}
x.filter=`brightness(${br.value}%) contrast(${co.value}%) saturate(${sa.value}%) blur(${bl.value}px) sepia(${sp.value}%)`;x.drawImage(img,0,0,c.width,c.height);x.filter='none'};
$('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const r=i.width/i.height;c.width=Math.min(i.width,1200);c.height=c.width/r;img=i;draw()};i.src=URL.createObjectURL(f)};
B.querySelectorAll('input[type=range]').forEach(r=>r.oninput=draw);
$('#rst').onclick=()=>{br.value=co.value=sa.value=100;bl.value=sp.value=0;draw()};
$('#dlp').onclick=()=>{if(!img)return;const a=document.createElement('a');a.download='maxime-phoenix.png';a.href=c.toDataURL('image/png');a.click()};draw()}
function voice(B){B.innerHTML=`<label>Texte à lire<textarea id="vt" rows="5">Bienvenue chez 2 PRO LUX. Innover, performer, rayonner.</textarea></label><div class="row"><label>Voix<select id="vs"></select></label><button class="btn" id="go">Écouter</button><button class="btn alt" id="st">Arrêter</button></div><p class="note">L’export audio en fichier sera ajouté avec le service de voix externe.</p>`;
const fill=()=>{$('#vs').innerHTML=speechSynthesis.getVoices().map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('')};fill();speechSynthesis.onvoiceschanged=fill;
$('#go').onclick=()=>{const u=new SpeechSynthesisUtterance($('#vt').value);const v=speechSynthesis.getVoices()[$('#vs').value];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)};$('#st').onclick=()=>speechSynthesis.cancel()}
function write(B){B.innerHTML=`<label>Sujet<input id="s" placeholder="Ex. lancement de ma nouvelle collection"></label><div class="row"><button class="btn" id="g">Préparer un texte</button></div><label>Résultat<textarea id="o" rows="8"></textarea></label><div class="row"><button class="btn alt" id="cp">Copier</button></div><p class="note">Ce gabarit se remplit à partir de votre sujet. La rédaction par IA sera connectée à l’étape GitHub.</p>`;
$('#g').onclick=()=>{const s=$('#s').value.trim()||'votre sujet';const tag='#'+s.split(/\s+/).slice(0,3).join('').replace(/[^\p{L}\p{N}]/gu,'');$('#o').value=`Accroche : Tout ce qu’il faut savoir sur ${s}.\n\nCorps : Voici l’essentiel en trois points concrets. 1) … 2) … 3) …\n\nAppel à l’action : Dites-moi en commentaire ce que vous en pensez.\n\n${tag} #MaximePhoenix #2PROLUX`};
$('#cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('#o').value)}
function models(B){B.innerHTML='<div class="grid">'+MODELS.map((m,i)=>`<button class="tool" data-i="${i}" style="all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px"><b style="color:var(--gold)">${m[0]}</b><span style="color:var(--mut);font-size:13px">${m[1]}</span></button>`).join('')+'</div><p class="note" id="msg">Touchez un modèle pour le copier.</p>';
B.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(MODELS[b.dataset.i][1]);$('#msg').textContent='Modèle copié.'})}
function dl(B){B.innerHTML=`<label>Lien de la vidéo<input id="u" placeholder="https://…"></label><div class="row"><button class="btn" id="d">Télécharger</button></div><p class="note" id="m">Réseaux prévus : TikTok, Facebook, YouTube, Instagram, Douyin, Bilibili. À utiliser pour vos propres vidéos ou celles dont vous avez les droits. Le téléchargement réel passe par un serveur, connecté à l’étape GitHub.</p>`;
$('#d').onclick=()=>{const u=$('#u').value.trim();$('#m').textContent=/^https?:\/\//.test(u)?'Lien reconnu. Le serveur de téléchargement n’est pas encore connecté.':'Collez un lien commençant par https://'}}
function tags(B){B.innerHTML=`<label>Sujet<input id="hs" placeholder="Ex. coiffure de luxe"></label><div class="row"><label>Réseau<select id="hn"><option>TikTok</option><option>Facebook</option><option>YouTube</option></select></label><button class="btn" id="hg">Générer</button><button class="btn alt" id="hc">Copier</button></div><textarea id="ho" rows="4"></textarea>`;
$('#hg').onclick=()=>{const w=$('#hs').value.trim().split(/\s+/).filter(Boolean).map(x=>'#'+x.replace(/[^\p{L}\p{N}]/gu,''));const e={TikTok:['#pourtoi','#fyp','#viral'],Facebook:['#reels','#communaute'],YouTube:['#shorts','#youtube']}[$('#hn').value];$('#ho').value=[...w,...e,'#MaximePhoenix','#2PROLUX'].join(' ')};
$('#hc').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('#ho').value)}
function dash(B){B.innerHTML='<div class="grid">'+NET.map(n=>`<div class="tool"><b>${n}</b><div class="stat">0</div><span>publications ce mois-ci</span></div>`).join('')+'</div><p class="note">Les chiffres s’afficheront quand vos comptes seront connectés.</p>'}
home();
const spl=$('#splash');const hide=()=>spl.classList.add('off');spl.onclick=hide;setTimeout(hide,2600);
</script></body></html>
