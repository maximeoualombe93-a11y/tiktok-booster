<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Booster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FBF6EE;--teal:#0B3D3A;--orange:#E8480C;--menthe:#DDF3E8}
*{box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:var(--fond);color:var(--teal);margin:0;padding:20px 16px 40px;max-width:600px;margin-inline:auto}
h1{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin:24px 0 6px}
h1 span{color:var(--orange)}
.sous{margin:0 0 22px;font-size:16px;opacity:.8}
input,button{width:100%;padding:16px;font-size:16px;font-family:inherit;border-radius:14px;margin-top:10px}
input{border:2px solid var(--teal);background:#fff;color:var(--teal)}
input:focus{outline:3px solid var(--menthe)}
button{border:0;background:var(--orange);color:#fff;font-weight:600;font-size:17px;cursor:pointer}
button:active{transform:scale(.98)}
.box{background:#fff;border:1px solid var(--menthe);border-left:6px solid var(--orange);border-radius:14px;padding:14px 16px;margin-top:16px}
h2{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:20px;margin:0 0 8px}
p{margin:8px 0;line-height:1.45}
</style>
</head>
<body>
<h1>TikTok <span>Booster</span></h1>
<p class="sous">Accroches, descriptions, hashtags et calendrier pour tes vidéos.</p>
<input id="sujet" placeholder="Sujet de ta vidéo (ex: foi, musique)">
<button onclick="generer()">Générer</button>
<div id="resultat"></div>
<script>
function esc(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function bloc(titre, lignes){
  var h = '<div class="box"><h2>' + titre + '</h2>';
  for(var i=0;i<lignes.length;i++){ h += "<p>" + lignes[i] + "</p>"; }
  return h + "</div>";
}
function generer(){
  var s = document.getElementById("sujet").value.trim();
  if(!s){ alert("Écris d'abord le sujet de ta vidéo"); return; }
  var e = esc(s);
  var accroches = [
    "Personne ne te dit ça sur " + e + "...",
    "3 choses à savoir sur " + e + " avant de scroller",
    "Regarde jusqu'à la fin : " + e
  ];
  var descriptions = [
    e + " : regarde jusqu'à la fin 🔥 Dis-moi ton avis en commentaire !",
    "Tu connaissais ça sur " + e + " ? Partage à quelqu'un qui en a besoin 🙏",
    "Nouvelle vidéo sur " + e + " ✨ Abonne-toi pour ne rien rater !"
  ];
  var mots = s.toLowerCase().split(/\s+/).filter(function(m){ return m.length > 2; });
  var tags = mots.map(function(m){ return "#" + m.replace(/[^\p{L}\p{N}]/gu, ""); });
  tags = tags.concat(["#pourtoi", "#fyp", "#tiktokfrance", "#viral"]);
  var calendrier = [
    "Lundi : vidéo principale sur " + e,
    "Mardi : une question à ta communauté",
    "Mercredi : conseil rapide",
    "Jeudi : témoignage ou histoire",
    "Vendredi : vidéo plus longue",
    "Samedi : réponds aux commentaires en vidéo",
    "Dimanche : repos ou bilan de la semaine"
  ];
  document.getElementById("resultat").innerHTML =
    bloc("Accroches", accroches) +
    bloc("Descriptions", descriptions) +
    bloc("Hashtags", [tags.join(" ")]) +
    bloc("Calendrier de la semaine", calendrier);
}
</script>
</body>
</html>
